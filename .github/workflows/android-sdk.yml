name: Android SDK
on:
  push:
    paths: ['iroh/**', 'android/**', 'scripts/android/**', '.github/workflows/android-sdk.yml']
  pull_request:
    paths: ['iroh/**', 'android/**', 'scripts/android/**', '.github/workflows/android-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-sdk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools
      - name: Toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          cargo +1.99.1 install cargo-ndk --version 4.1.2 --locked
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            iroh/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sdk-${{ runner.os }}-${{ hashFiles('iroh/Cargo.lock', 'android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Emulator invitation fixture tests
        run: python3 -m unittest discover -s scripts/android -p 'test_*.py'
      - name: Rust tests and lint
        working-directory: iroh
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --locked -p iroh-host --bins
          bash ../scripts/ci/e2e.sh target/debug
      - name: Build and inspect AAR
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash scripts/android/build-aar.sh
      - name: Independent AAR consumer compiles
        working-directory: android
        run: ./gradlew :sample:assembleDebug :iroh-client:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: iroh-client-android-0.1.0
          path: |
            dist/*
            android/iroh-client/src/main/jniLibs/*/*.so
            android/sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android JNI lifecycle and real-host Range test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android/emulator-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-sdk-test-results
          path: android/iroh-client/build/reports/androidTests/
