name: Binaries

# Pushing a tag such as v0.3.0 builds, tests and publishes a GitHub Release.
# Running the workflow manually only builds downloadable artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  # getifaddrs, used for network interface discovery, needs API 24.
  ANDROID_API: "24"

jobs:
  version:
    name: Version check
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: All versions agree with each other and the tag
        id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(bash scripts/ci/check-version.sh "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: iroh
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup override set "$RUST_TOOLCHAIN"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            iroh/target
          key: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('iroh/Cargo.lock') }}
          restore-keys: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-

      # Static musl binaries run on any Linux distribution regardless of its glibc version.
      - name: Build
        env:
          CC: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p iroh-host --bins

      - name: Binaries are static and report the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          dir=target/${{ matrix.target }}/release
          for b in iroh-host iroh-test-client; do
            file "$dir/$b" | grep -Eq 'statically linked|static-pie linked'
            "$dir/$b" --version | grep -F "$VERSION"
          done

      - name: End-to-end test with the release binaries
        timeout-minutes: 5
        run: bash ../scripts/ci/e2e.sh target/${{ matrix.target }}/release

      - name: Package
        run: bash ../scripts/ci/package-binaries.sh target/${{ matrix.target }}/release ${{ matrix.target }} "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-iroh-${{ matrix.target }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          # Many Android TV devices run a 32-bit userland even on 64-bit chips.
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
    defaults:
      run:
        working-directory: iroh
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup override set "$RUST_TOOLCHAIN"
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            iroh/target
          key: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('iroh/Cargo.lock') }}
          restore-keys: bin-${{ matrix.target }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Build
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t ${{ matrix.abi }} -P "$ANDROID_API" build --release --locked -p iroh-host --bins

      - name: Package
        run: |
          file target/${{ matrix.target }}/release/iroh-test-client
          bash ../scripts/ci/package-binaries.sh target/${{ matrix.target }}/release android-${{ matrix.abi }} "$RUNNER_TEMP/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-iroh-android-${{ matrix.abi }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  plugin:
    name: Jellyfin plugin
    needs: version
    runs-on: ubuntu-24.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: jellyfin-plugin/global.json

      - name: Test
        run: dotnet test jellyfin-plugin/Jellyfin.Plugin.Iroh.Tests/Jellyfin.Plugin.Iroh.Tests.csproj -c Release

      # The zip holds the JellyfinIroh_<version> folder that goes into Jellyfin's plugins directory.
      - name: Build and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          dotnet publish jellyfin-plugin/Jellyfin.Plugin.Iroh/Jellyfin.Plugin.Iroh.csproj -c Release -o "$RUNNER_TEMP/publish"
          sh docker/package-plugin.sh "$RUNNER_TEMP/publish" jellyfin-plugin/meta.json "$RUNNER_TEMP/plugin"
          name="jellyfin-iroh-$VERSION-jellyfin-plugin.zip"
          mkdir -p "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/plugin" && zip -r "$RUNNER_TEMP/dist/$name" .)
          (cd "$RUNNER_TEMP/dist" && sha256sum "$name" > "$name.sha256")
          unzip -l "$RUNNER_TEMP/dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-iroh-jellyfin-plugin
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    # Only tag pushes publish; manual runs stop at the artifacts above.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, linux, android, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: jellyfin-iroh-*
          path: dist
          merge-multiple: true

      - name: Verify checksums and write SHA256SUMS
        working-directory: dist
        run: |
          set -eux
          sha256sum -c ./*.sha256
          cat ./*.sha256 | sort -k 2 > SHA256SUMS
          ls -l

      - name: Create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ $TAG == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" ./* \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${prerelease[@]}"
