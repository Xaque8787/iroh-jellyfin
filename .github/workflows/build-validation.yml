name: Build Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  RUST_MSRV: "1.91.0"

jobs:
  rust:
    name: Rust (fmt, clippy, test, smoke)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: iroh
    steps:
      - uses: actions/checkout@v5

      - name: Versions agree
        working-directory: .
        run: bash scripts/ci/check-version.sh

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup override set "$RUST_TOOLCHAIN"
          cargo --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            iroh/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('iroh/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      # If Cargo.lock is stale, regenerate it so the remaining checks still run, publish the
      # corrected file as an artifact, and fail the run at the end.
      - name: Lockfile is current
        id: lock
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null; then
            echo "flag=--locked" >> "$GITHUB_OUTPUT"
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            cargo update --workspace
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::error file=iroh/Cargo.lock::Cargo.lock is out of date. Download the 'corrected-cargo-lock' artifact from this run and commit it as iroh/Cargo.lock."
          fi

      - name: Upload corrected Cargo.lock
        if: steps.lock.outputs.stale == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corrected-cargo-lock
          path: iroh/Cargo.lock

      - name: Formatting
        id: fmt
        continue-on-error: true
        run: cargo fmt --all --check

      # Formatting is applied by CI because the authoring environment cannot run rustfmt.
      - name: Upload formatting fix
        if: steps.fmt.outcome == 'failure'
        run: |
          cargo fmt --all
          git diff -- '*.rs' > "$RUNNER_TEMP/rustfmt.patch"
          echo "::error::Formatting differs. Download the 'rustfmt-patch' artifact and apply it with: git apply rustfmt.patch"

      - name: Upload rustfmt.patch
        if: steps.fmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets ${{ steps.lock.outputs.flag }} -- -D warnings

      - name: Tests
        id: test
        continue-on-error: true
        run: cargo test --workspace --no-fail-fast ${{ steps.lock.outputs.flag }}

      - name: CLI smoke test
        id: smoke
        continue-on-error: true
        run: |
          set -eux
          cargo build ${{ steps.lock.outputs.flag }} -p iroh-host
          ./target/debug/iroh-host --version
          id_first=$(./target/debug/iroh-host identity --data-dir "$RUNNER_TEMP/smoke")
          id_second=$(./target/debug/iroh-host identity --data-dir "$RUNNER_TEMP/smoke")
          test -n "$id_first" && test "$id_first" = "$id_second"
          test "$(stat -c %a "$RUNNER_TEMP/smoke/identity.key")" = "600"
          test "$(stat -c %a "$RUNNER_TEMP/smoke")" = "700"
          test "$(stat -c %a "$RUNNER_TEMP/smoke/state.json" 2>/dev/null || echo none)" = "none"
          # No origin is listening on port 9, so doctor must report a failure and exit non-zero.
          if ./target/debug/iroh-host doctor --data-dir "$RUNNER_TEMP/smoke" --origin http://127.0.0.1:9; then
            echo "doctor should fail without a reachable origin" && exit 1
          fi
          test "$(stat -c %a "$RUNNER_TEMP/smoke/state.json")" = "600"

      - name: End-to-end test (host and client, relays disabled)
        id: e2e
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cargo build ${{ steps.lock.outputs.flag }} -p iroh-host --bins
          bash ../scripts/ci/e2e.sh target/debug

      - name: Summary
        if: always()
        env:
          LOCK: ${{ steps.lock.outputs.stale == 'false' && 'success' || 'failure' }}
          FMT: ${{ steps.fmt.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          mark() { [ "$1" = "success" ] && echo "pass" || echo "FAIL ($1)"; }
          {
            echo "## Build Validation"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Cargo.lock up to date | $(mark "$LOCK") |"
            echo "| Formatting | $(mark "$FMT") |"
            echo "| Clippy (warnings are errors) | $(mark "$CLIPPY") |"
            echo "| Unit tests | $(mark "$TEST") |"
            echo "| CLI smoke test | $(mark "$SMOKE") |"
            echo "| End-to-end pairing, Range, revoke | $(mark "$E2E") |"
          } >> "$GITHUB_STEP_SUMMARY"
          for outcome in "$LOCK" "$FMT" "$CLIPPY" "$TEST" "$SMOKE" "$E2E"; do
            [ "$outcome" = "success" ] || exit 1
          done

  msrv:
    name: Rust minimum supported version (1.91)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: iroh
    steps:
      - uses: actions/checkout@v5
      - name: Install MSRV toolchain
        run: |
          rustup toolchain install "$RUST_MSRV" --profile minimal
          rustup override set "$RUST_MSRV"
      # Not --locked: a stale lockfile is reported by the main job; this job only checks the compiler version.
      - name: Check
        run: cargo check --workspace

  plugin:
    name: Jellyfin plugin (build, test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: jellyfin-plugin
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: jellyfin-plugin/global.json
      - name: Build
        run: dotnet build Jellyfin.Plugin.Iroh/Jellyfin.Plugin.Iroh.csproj -c Release
      - name: Tests
        run: dotnet test Jellyfin.Plugin.Iroh.Tests/Jellyfin.Plugin.Iroh.Tests.csproj -c Release
      - name: Dashboard page script parses
        run: |
          python3 - <<'EOF' > "$RUNNER_TEMP/configPage.js"
          import re
          html = open("Jellyfin.Plugin.Iroh/Configuration/configPage.html", encoding="utf-8").read()
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
          assert len(scripts) == 1, scripts
          print(scripts[0])
          EOF
          node --check "$RUNNER_TEMP/configPage.js"

  docker:
    name: Docker image (build, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jellyfin-iroh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        timeout-minutes: 10
        run: bash scripts/ci/docker-smoke.sh jellyfin-iroh:ci
