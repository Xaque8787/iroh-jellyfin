[workspace]
resolver = "2"
members = [
    "crates/iroh-transport",
    "crates/iroh-host",
    "crates/iroh-client",
    "crates/iroh-client-android",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Iroh is pinned exactly: its API was verified against 1.4.1. Upgrading requires re-verification.
iroh = "=1.4.1"

# Minimum versions; Cargo.lock pins the exact resolved versions for reproducible builds.
base64 = "0.22.1"
bytes = "1.10"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
http = "1.3"
http-body-util = "0.1.3"
hyper = { version = "1.7", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.17", features = ["client-legacy", "http1", "tokio"] }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal", "io-std"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-util = { version = "0.7.16", features = ["io", "rt"] }

iroh-transport = { path = "crates/iroh-transport" }

iroh-client = { path = "crates/iroh-client" }
