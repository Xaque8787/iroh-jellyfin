[package]
name = "iroh-host"
description = "Standalone Iroh host that forwards a local HTTP origin to paired devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "iroh-host"
path = "src/main.rs"

# Development and CI client; not part of the shipped host.
[[bin]]
name = "iroh-test-client"
path = "src/bin/iroh-test-client.rs"

[dependencies]
iroh.workspace = true
iroh-transport.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
